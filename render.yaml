services:
  - type: web
    name: football-prophet
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:create_app --host 0.0.0.0 --port $PORT --factory
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///football_prophet.db"
